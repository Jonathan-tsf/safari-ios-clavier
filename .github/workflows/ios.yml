name: iOS Safari keyboard test
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to test
        default: https://wonderhop.io/en/
jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Simulators
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -i iphone | head -20
      - name: Appium
        run: |
          npm i -g appium@3
          appium driver install xcuitest
          npm i webdriverio@9
          UDID=$(node -e 'const d=JSON.parse(require("child_process").execSync("xcrun simctl list devices available -j")).devices;const r=Object.keys(d).filter(k=>k.includes("iOS")).sort().pop();const i=d[r].find(x=>/^iPhone 1[6-7]( |$)/.test(x.name))||d[r].find(x=>x.name.startsWith("iPhone"));console.log(i.udid)')
          echo "UDID=$UDID" >> $GITHUB_ENV
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID"
          appium driver run xcuitest build-wda || true
          appium --log appium.log --relaxed-security &
          sleep 8
      - name: Test
        env:
          URL: ${{ inputs.url }}
        run: node test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            out/
            appium.log
