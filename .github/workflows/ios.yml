name: iOS Safari keyboard test
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to test
        default: https://wonderhop.io/en/
jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Simulators
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -i iphone | head -20
      - name: Appium
        run: |
          npm i -g appium@3
          appium driver install xcuitest
          npm i webdriverio@9
          UDID=$(node -e 'const d=JSON.parse(require("child_process").execSync("xcrun simctl list devices available -j")).devices;const r=Object.keys(d).filter(k=>k.includes("iOS")).sort().pop();const i=d[r].find(x=>/^iPhone 1[6-7]( |$)/.test(x.name))||d[r].find(x=>x.name.startsWith("iPhone"));console.log(i.udid)')
          echo "UDID=$UDID" >> $GITHUB_ENV
          # software keyboard: hardware keyboard disconnected globally AND for this device, before boot
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences dict" ~/Library/Preferences/com.apple.iphonesimulator.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID dict" ~/Library/Preferences/com.apple.iphonesimulator.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$UDID:ConnectHardwareKeyboard bool false" ~/Library/Preferences/com.apple.iphonesimulator.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$UDID:ConnectHardwareKeyboard false" ~/Library/Preferences/com.apple.iphonesimulator.plist
          defaults read com.apple.iphonesimulator | head -40
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          appium driver run xcuitest build-wda || true
          nohup appium --log appium.log --relaxed-security > appium.out 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:4723/status >/dev/null && echo "appium ready" && break; sleep 2; done
      - name: Test
        env:
          URL: ${{ inputs.url }}
        run: node test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            out/
            appium.log
